<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Runway Muse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: a fashion-house studio. Desktop: model stage | wardrobe | stylist notes. Phones stack stage, stylist summary, wardrobe.
   Palette: ink and porcelain with a single fuchsia accent, like a fashion magazine. */
:root {
  --paper: #f6f2f4;        /* porcelain page */
  --card: #ffffff;
  --ink: #1d1720;
  --muted: #74697a;
  --line: #e4dbe2;
  --accent: #c2185b;       /* fuchsia */
  --accent-soft: #fbe3ec;
  --good: #2e7d5b;
  --warn: #c0612b;
  --gold: #b8913a;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; }
button { font-family: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px; background: rgba(246,242,244,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: .01em; margin-right: auto; display: flex; align-items: baseline; gap: 8px; }
.brand i { font-style: italic; font-weight: 500; color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.pill b { font-variant-numeric: tabular-nums; }
.pill.cta { background: var(--ink); color: #fff; border-color: var(--ink); }
.pill.cta:hover { background: var(--accent); border-color: var(--accent); }
.coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe9a8, var(--gold)); display: inline-block; }

.app { display: grid; gap: 16px; padding: 16px; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr) minmax(260px, 330px); align-items: start; max-width: 1500px; margin: 0 auto; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }

/* stage */
.stage-wrap { position: sticky; top: 76px; display: grid; gap: 10px; }
.brief { padding: 12px 14px; display: grid; gap: 6px; }
.brief .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.brief h2 { font-family: var(--display); font-size: 24px; margin: 0; line-height: 1.1; font-weight: 700; }
.brief p { margin: 0; color: var(--muted); font-size: 14px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.check { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.check.ok { background: #e6f4ec; border-color: #bfe3cf; color: var(--good); }
.check.ok::before { content: "✓ "; }
.check.no { background: #fdeee8; border-color: #f4cdbd; color: var(--warn); }
.check.no::before { content: "✕ "; }
.stage { position: relative; aspect-ratio: 3 / 4.2; max-width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.score-badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.92); border-radius: 12px; padding: 6px 10px; text-align: center; border: 1px solid var(--line); }
.score-badge b { display: block; font-family: var(--display); font-size: 28px; line-height: 1; }
.score-badge span { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 13px; }
.stage-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.stage-actions .pill { flex: 1; justify-content: center; }

/* wardrobe */
.wardrobe { padding: 0 0 14px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 8px 8px 0; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { flex: none; border: 0; background: none; padding: 10px 12px 9px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.section { padding: 12px 14px 0; display: grid; gap: 8px; }
.section h3 { margin: 0; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.item { position: relative; border: 1px solid var(--line); background: #fbf9fa; border-radius: 10px; padding: 6px 4px 6px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--ink); }
.item svg { width: 64px; height: 64px; }
.item[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: var(--accent-soft); }
.item .price { position: absolute; top: 4px; right: 4px; font-size: 10.5px; font-weight: 600; background: var(--ink); color: #fff; border-radius: 999px; padding: 1px 6px; display: flex; gap: 3px; align-items: center; }
.item.locked svg { opacity: .45; filter: grayscale(.6); }
.item .none { width: 64px; height: 64px; display: grid; place-items: center; color: var(--muted); font-size: 26px; }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; }
.sw { position: relative; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw .pick { position: absolute; top: -6px; right: -6px; background: var(--accent); color: #fff; border-radius: 999px; font-size: 9px; font-weight: 600; padding: 1px 4px; border: 1.5px solid #fff; }
.picks-note { font-size: 13px; color: var(--muted); }
.picks-note b { color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fbf9fa; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
.chip svg { width: 18px; height: 18px; border-radius: 50%; }
.unlock { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
.unlock button { margin-left: auto; }

/* stylist */
.stylist { padding: 14px; display: grid; gap: 12px; position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto; }
.stylist h3 { margin: 0; font-family: var(--display); font-size: 22px; }
.ring-row { display: flex; align-items: center; gap: 14px; }
.ring { width: 84px; height: 84px; flex: none; }
.areas { display: grid; gap: 6px; flex: 1; min-width: 0; }
.area { display: grid; grid-template-columns: 70px 1fr 26px; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.area .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.area .bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width .3s; }
.area b { font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
.palette-strip { display: flex; height: 22px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.palette-strip span { flex: 1; }
.harmony { font-size: 13px; color: var(--muted); }
.harmony b { color: var(--ink); }
.notes { display: grid; gap: 8px; }
.note { border-radius: 10px; padding: 9px 11px; font-size: 14px; display: grid; gap: 6px; border: 1px solid var(--line); }
.note.good { background: #eef8f2; border-color: #cfeadb; }
.note.warn { background: #fdf1ea; border-color: #f4d6c4; }
.note.tip { background: #f4f1fb; border-color: #e0d8f2; }
.note .k { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
.note.good .k { color: var(--good); } .note.warn .k { color: var(--warn); } .note.tip .k { color: #6a4fb0; }
.note button { justify-self: start; border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.note button i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid #fff; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(29,23,32,.55); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.sheet { background: var(--card); border-radius: 16px; width: min(760px, 100%); padding: 18px; display: grid; gap: 14px; max-height: calc(100vh - 32px); overflow-y: auto; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sheet h2 { font-family: var(--display); font-size: 30px; margin: 0; }
.challenges { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ch { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 0; overflow: hidden; background: #fff; cursor: pointer; display: grid; }
.ch .scene { height: 70px; }
.ch .body { padding: 10px 12px; display: grid; gap: 3px; }
.ch .body b { font-family: var(--display); font-size: 18px; }
.ch .body span { font-size: 13px; color: var(--muted); }
.ch.locked { opacity: .55; cursor: not-allowed; }
.looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.look { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; cursor: pointer; padding: 0; display: grid; }
.look svg { width: 100%; height: auto; aspect-ratio: 3 / 4.2; }
.look span { font-size: 12px; padding: 6px 8px; text-align: left; }
.empty { color: var(--muted); }

.runway { position: fixed; inset: 0; z-index: 60; background: #120d14; color: #fff; display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
.runway-stage { position: relative; overflow: hidden; }
.runway-stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 20%, rgba(255,230,240,.22), rgba(0,0,0,0) 55%), linear-gradient(#1b1320, #0c080e); }
.catwalk { position: absolute; left: 50%; bottom: 0; width: 46%; height: 70%; transform: translateX(-50%) perspective(600px) rotateX(55deg); transform-origin: bottom; background: repeating-linear-gradient(90deg, #2a2030 0 2px, #1d1622 2px 40px); border-top: 2px solid rgba(255,255,255,.25); }
.walker { position: absolute; left: 50%; bottom: 3%; height: 72%; aspect-ratio: 3 / 4.2; transform: translateX(-50%); animation: walk 2.6s cubic-bezier(.3,.1,.3,1) both; }
.walker svg { width: 100%; height: 100%; }
@keyframes walk { from { transform: translateX(-50%) scale(.45) translateY(-30%); opacity: 0; } 20% { opacity: 1; } to { transform: translateX(-50%) scale(1) translateY(0); } }
.flash { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 30px 12px rgba(255,255,255,.8); opacity: 0; animation: pop .5s ease-out forwards; }
@keyframes pop { 0% { opacity: 1; } 100% { opacity: 0; transform: scale(2.4); } }
.judges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: #1c1520; border-top: 1px solid #33283a; }
.judge { background: #251c2a; border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; opacity: 0; transform: translateY(10px); transition: all .45s; }
.judge.in { opacity: 1; transform: none; }
.judge .who { font-size: 12px; color: #c9b8cf; letter-spacing: .08em; text-transform: uppercase; }
.judge .sc { font-family: var(--display); font-size: 34px; line-height: 1; color: #ffd6e6; }
.judge .say { font-size: 13px; color: #e8dcec; }
.verdict { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); text-align: center; display: grid; gap: 4px; opacity: 0; transition: opacity .5s; padding: 12px 16px; background: rgba(18,13,20,.78); border: 1px solid #3a2e40; border-radius: 16px; pointer-events: none; }
.verdict.in { pointer-events: auto; }
.verdict.in { opacity: 1; }
.verdict h2 { font-family: var(--display); font-size: clamp(30px, 6vw, 52px); margin: 0; }
.verdict .stars { font-size: 26px; }
.verdict p { margin: 0; color: #e8dcec; }
.verdict .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.verdict .pill { background: #fff; color: var(--ink); border-color: #fff; }
.verdict .pill.ghost { background: transparent; color: #fff; border-color: #6b5874; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; z-index: 70; font-size: 14px; }

@media (max-width: 1150px) {
  .app { grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); }
  .stylist { position: static; max-height: none; grid-column: 1; }
  .wardrobe { grid-row: span 2; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
  .stage-wrap, .stylist { position: static; }
  .stage { aspect-ratio: auto; height: min(62vh, 520px); }
  .wardrobe { grid-row: auto; order: 3; }
  .stylist { order: 2; }
  .brand { font-size: 22px; }
  .judges { grid-template-columns: 1fr; gap: 6px; }
  .judge { padding: 8px 10px; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
  .judge .sc { font-size: 26px; grid-row: span 2; }
}
@media (prefers-reduced-motion: reduce) { .walker, .flash { animation: none; } .judge, .verdict { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="pill" href="../" id="homeLink">← Home</a>
  <span class="brand">Runway <i>Muse</i></span>
  <button class="pill" id="challengeBtn" type="button">Client briefs</button>
  <button class="pill" id="lookbookBtn" type="button">Lookbook</button>
  <span class="pill" title="Coins: earn them on the runway, spend them on new pieces"><i class="coin"></i><b id="coins">0</b></span>
</header>

<main class="app">
  <section class="stage-wrap" aria-label="Your model">
    <div class="panel brief" id="brief"></div>
    <div class="stage" id="stage">
      <svg id="model" viewBox="0 0 300 640" role="img" aria-label="Your styled model"></svg>
      <div class="score-badge"><b id="badgeScore">0</b><span>Style score</span><div class="stars" id="badgeStars"></div></div>
    </div>
    <div class="stage-actions">
      <button class="pill" id="autoBtn" type="button">✨ Style me</button>
      <button class="pill" id="saveBtn" type="button">Save look</button>
      <button class="pill cta" id="runwayBtn" type="button">Walk the runway</button>
    </div>
  </section>

  <section class="panel wardrobe" aria-label="Wardrobe">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="tabBody"></div>
  </section>

  <aside class="panel stylist" aria-label="Stylist feedback">
    <h3>Your stylist</h3>
    <div class="ring-row">
      <svg class="ring" viewBox="0 0 84 84" id="ring"></svg>
      <div class="areas" id="areas"></div>
    </div>
    <div class="palette-strip" id="strip" title="Your outfit's colours"></div>
    <div class="harmony" id="harmony"></div>
    <div class="notes" id="notes"></div>
  </aside>
</main>

<div class="overlay" id="challengeSheet" hidden>
  <div class="sheet">
    <div class="sheet-head"><h2>Client briefs</h2><button class="pill" data-close type="button">Close</button></div>
    <p class="empty">Style each client for their occasion. Score 3 stars or more to unlock the next brief. Free Studio is always open.</p>
    <div class="challenges" id="challenges"></div>
  </div>
</div>
<div class="overlay" id="lookbookSheet" hidden>
  <div class="sheet">
    <div class="sheet-head"><h2>Lookbook</h2><button class="pill" data-close type="button">Close</button></div>
    <div class="looks" id="looks"></div>
  </div>
</div>
<div class="runway" id="runway" hidden>
  <div class="runway-stage" id="runwayStage">
    <div class="catwalk"></div>
    <div class="walker" id="walker"></div>
    <div class="verdict" id="verdict"></div>
  </div>
  <div class="judges" id="judges"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- colour library ----------
  const PALETTE = [
    ['black', 'Black', '#1c1b1f', 1], ['white', 'White', '#f7f5f0', 1], ['ivory', 'Ivory', '#ece2cc', 1], ['beige', 'Beige', '#d8c0a0', 1],
    ['camel', 'Camel', '#b8875a', 1], ['chocolate', 'Chocolate', '#5a3a28', 1], ['grey', 'Grey', '#8d8c93', 1], ['navy', 'Navy', '#1f2b4a', 1], ['denim', 'Denim', '#4a6a94', 1],
    ['red', 'Red', '#c8102e', 0], ['burgundy', 'Burgundy', '#6d1a2c', 0], ['coral', 'Coral', '#ef7563', 0], ['orange', 'Orange', '#e8772e', 0], ['mustard', 'Mustard', '#d4a017', 0],
    ['yellow', 'Butter', '#f3d97a', 0], ['olive', 'Olive', '#6b7036', 0], ['sage', 'Sage', '#9caf88', 0], ['emerald', 'Emerald', '#1f7a5a', 0], ['teal', 'Teal', '#1d7f8c', 0],
    ['sky', 'Sky', '#9cc9e8', 0], ['royal', 'Cobalt', '#2643b8', 0], ['lilac', 'Lilac', '#c6aee2', 0], ['purple', 'Plum', '#6a3d9a', 0], ['blush', 'Blush', '#f2c6cf', 0], ['fuchsia', 'Fuchsia', '#d6286f', 0],
  ];
  const C = {};
  for (const [key, name, hex, neutral] of PALETTE) C[key] = { key, name, hex, neutral: !!neutral, ...hsl(hex) };
  function hsl(hex) {
    const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    let h = 0, s = 0;
    if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
    return { h, s, l };
  }
  const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = c => clamp(Math.round(c * k), 0, 255); return '#' + [n >> 16, n >> 8 & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join(''); };
  const hueGap = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
  const SKINS = ['#f7dcca', '#efc3a4', '#dca47e', '#bc7d57', '#8f5b3c', '#5d3925'];
  const HAIRC = { black: ['Black', '#1b1512'], espresso: ['Espresso', '#3a2318'], brown: ['Brown', '#6b4226'], auburn: ['Auburn', '#8c3b1f'], blonde: ['Blonde', '#d8b46a'], platinum: ['Platinum', '#ece0c6'], rose: ['Rose', '#e08aae'], ink: ['Midnight', '#25304f'] };
  const LIPS = { nude: '#c98b7b', rose: '#c45a6e', red: '#b3162b', berry: '#7c1f3e', coral: '#e2634f' };
  const METALS = { gold: ['Gold', '#d4ad4b'], silver: ['Silver', '#c2c8ce'], rose: ['Rose gold', '#dea08a'], pearl: ['Pearl', '#f3ede2'] };
  const PATTERNS = [['solid', 'Solid', 0], ['stripes', 'Stripes', 0], ['dots', 'Polka dots', 0], ['floral', 'Floral', 60], ['check', 'Gingham', 40], ['leopard', 'Leopard', 80]];

  // ---------- drawing helpers (viewBox 300 x 640, model faces you, x = 150 is the centre line) ----------
  const P = (d, f, s, extra = '') => `<path d="${d}" fill="${f}" stroke="${s}" stroke-width="1.1" stroke-linejoin="round" ${extra}/><path d="${d}" fill="url(#fold)" pointer-events="none"/>`;
  const L = (d, s, w = 1, extra = '') => `<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  const MIR = s => `<g transform="translate(300 0) scale(-1 1)">${s}</g>`;
  const BOTH = s => s + MIR(s);
  const sleeveShort = 'M110 128 Q100 132 97 148 L92 184 L107 186 L109 160 Z';
  const sleeveLong = 'M110 128 Q100 132 97 150 L90 240 Q86 290 84 324 L98 326 Q101 290 104 244 L108 174 Z';

  // garments: draw(fill, stroke, colorHex) -> svg; vb = thumbnail crop; f = formality 0 (sporty) .. 4 (black tie)
  const ITEMS = {

    else if (f.formality != null) {
      const opts = (ALL_ITEMS[f.slot] || []).filter(i => isOwned(i) && Math.abs(i.f - f.formality) <= 1 && (!outfit[f.slot] || i.id !== outfit[f.slot].id));
      if (opts.length) outfit[f.slot] = { ...(outfit[f.slot] || { color: 'black', pattern: 'solid' }), id: opts[0].id };
    } else if (f.slot) { const best = bestColors(f.slot, c => c.key !== outfit[f.slot].color, 1)[0]; if (best) outfit[f.slot].color = best.key; }
    render(); toast('Stylist fix applied');
  }
  const isOwned = it => !it.cost || owned.has(it.id);
  const firstOwned = slot => (ALL_ITEMS[slot] || []).find(isOwned).id;

  // "Style me": build a look for the brief, then let the stylist choose colours
  function autoStyle() {
    const ch = challenge();
    const owned_ = slot => (ALL_ITEMS[slot] || []).filter(isOwned);
    let best = null;
    for (let attempt = 0; attempt < 60; attempt++) {
      const o = JSON.parse(JSON.stringify(outfit));
      const pick = arr => arr[Math.floor(Math.random() * arr.length)];
      const useDress = Math.random() < 0.45 && owned_('dress').length;
      o.dress = useDress ? { id: pick(owned_('dress')).id, color: 'black', pattern: 'solid' } : null;
      o.top = useDress ? null : { id: pick(owned_('top')).id, color: 'white', pattern: 'solid' };
      o.bottom = useDress ? null : { id: pick(owned_('bottom')).id, color: 'denim', pattern: 'solid' };
      o.outer = Math.random() < 0.45 ? { id: pick(owned_('outer')).id, color: 'camel', pattern: 'solid' } : null;
      o.shoes = { id: pick(owned_('shoes')).id, color: 'black' };
      o.bag = Math.random() < 0.7 ? { id: pick(owned_('bag')).id, color: 'black' } : null;
      o.hat = Math.random() < 0.3 ? { id: pick(owned_('hat')).id, color: 'black' } : null;
      o.earrings = Math.random() < 0.7 ? pick(EARRINGS.filter(isOwned)).id : null;
      o.necklace = Math.random() < 0.4 ? pick(NECKLACES.filter(isOwned)).id : null;
      o.belt = Math.random() < 0.25 ? 'thin' : null;
      // colour pass: each slot takes the colour the stylist likes best
      const keys = Object.keys(C);
      for (const slot of ['dress', 'top', 'bottom', 'outer', 'shoes', 'bag', 'hat']) {
        if (!o[slot]) continue;
        let bk = o[slot].color, bs = -1;
        for (let i = 0; i < 10; i++) { const k = pick(keys); o[slot].color = k; const s = analyze(o, ch, false).total; if (s > bs) { bs = s; bk = k; } }
        o[slot].color = bk;
      }
      const score = analyze(o, ch, false).total;
      if (!best || score > best.score) best = { o, score };
    }
    outfit = best.o; render(); toast('Your stylist put together a look');
  }

  // ---------- wardrobe UI ----------
  const TABS = [['look', 'Hair & beauty'], ['top', 'Tops'], ['bottom', 'Bottoms'], ['dress', 'Dresses'], ['outer', 'Outerwear'], ['shoes', 'Shoes'], ['bag', 'Bags'], ['jewel', 'Jewellery'], ['hat', 'Hats & belts']];
  let tab = 'top';
  function renderTabs() {
    $('tabs').innerHTML = TABS.map(([k, n]) => `<button class="tab" role="tab" aria-selected="${k === tab}" data-tab="${k}" type="button">${n}</button>`).join('');
  }
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; renderTabs(); renderTab(); } });

  function thumb(slot, it, color) {
    const defs = new Map(), c = C[color] || C.beige;
    const svg = it.draw(fabric(color, 'solid', defs), shade(c.hex, c.l > 0.85 ? 0.78 : 0.62), c.hex);
    return `<svg viewBox="${it.vb}" aria-hidden="true"><defs><linearGradient id="fold" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient></defs>${svg}</svg>`;
  }
  const priceTag = it => it.cost && !owned.has(it.id) ? `<span class="price"><i class="coin"></i>${it.cost}</span>` : '';
  let pendingUnlock = null;
  function renderTab() {
    const body = $('tabBody'); let h = '';
    if (tab === 'look') {
      h += section('Skin tone', `<div class="swatches">${SKINS.map((s, i) => `<button class="sw" style="background:${s}" data-skin="${i}" aria-pressed="${outfit.skin === i}" aria-label="Skin tone ${i + 1}" type="button"></button>`).join('')}</div>`);
      h += section('Hairstyle', `<div class="grid">${HAIR.map(hs => `<button class="item" data-hair="${hs.id}" aria-pressed="${outfit.hair.style === hs.id}" type="button"><svg viewBox="96 0 108 130">${hairBack(hs.id, HAIRC[outfit.hair.color][1])}<ellipse cx="150" cy="72" rx="26" ry="32" fill="${SKINS[outfit.skin]}"/>${hairFront(hs.id, HAIRC[outfit.hair.color][1])}</svg>${hs.name}</button>`).join('')}</div>`);
      h += section('Hair colour', `<div class="swatches">${Object.entries(HAIRC).map(([k, [n, c]]) => `<button class="sw" style="background:${c}" data-haircolor="${k}" aria-pressed="${outfit.hair.color === k}" title="${n}" aria-label="${n}" type="button"></button>`).join('')}</div>`);
      h += section('Lipstick', `<div class="swatches">${Object.entries(LIPS).map(([k, c]) => `<button class="sw" style="background:${c}" data-lips="${k}" aria-pressed="${outfit.lips === k}" title="${k}" aria-label="${k} lipstick" type="button"></button>`).join('')}</div>`);
    } else if (tab === 'jewel') {
      h += section('Earrings', chipRow(EARRINGS, 'earrings'));
      h += section('Necklace', chipRow(NECKLACES, 'necklace'));
      h += section('Metal', `<div class="chips">${Object.entries(METALS).map(([k, [n, c]]) => `<button class="chip" data-metal="${k}" aria-pressed="${outfit.metal === k}" type="button"><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="${c}"/></svg>${n}</button>`).join('')}</div>`);
      h += `<div class="section"><p class="picks-note">Tip: keep all metals the same family, gold or silver, for a polished finish.</p></div>`;
    } else {
      const slot = tab;
      const list = ALL_ITEMS[slot];
      const sel = outfit[slot];
      const optional = slot !== 'shoes';
      h += section(TABS.find(t => t[0] === tab)[1], `<div class="grid">${optional ? `<button class="item" data-item="" aria-pressed="${!sel}" type="button"><span class="none">∅</span>None</button>` : ''}${list.map(it => `<button class="item ${isOwned(it) ? '' : 'locked'}" data-item="${it.id}" aria-pressed="${!!sel && sel.id === it.id}" type="button">${priceTag(it)}${thumb(slot, it, sel ? sel.color : 'beige')}${it.name}</button>`).join('')}</div>`);
      if (pendingUnlock && pendingUnlock.slot === slot) {
        const it = itemById(slot, pendingUnlock.id);
        h += `<div class="section"><div class="unlock">Unlock the <b>${it.name}</b> for ${it.cost} coins?<button class="pill cta" data-buy="${it.id}" type="button">Unlock</button></div></div>`;
      }
      if (slot === 'hat') h += section('Belt', chipRow(BELTS, 'belt'));
      if (sel) {
        const picks = bestColors(slot).map(p => p.key);
        h += section('Colour', `<p class="picks-note"><b>★ Stylist picks</b> for this outfit: ${picks.map(k => C[k].name).join(', ')}</p><div class="swatches">${Object.values(C).map(c => `<button class="sw" style="background:${c.hex}" data-color="${c.key}" aria-pressed="${sel.color === c.key}" title="${c.name}" aria-label="${c.name}" type="button">${picks.includes(c.key) ? '<span class="pick">★</span>' : ''}</button>`).join('')}</div>`);
        if (['top', 'bottom', 'dress', 'outer'].includes(slot)) {
          h += section('Print', `<div class="chips">${PATTERNS.map(([k, n, cost]) => `<button class="chip" data-pattern="${k}" aria-pressed="${(sel.pattern || 'solid') === k}" type="button">${n}${cost && !owned.has('pat-' + k) ? ` · <i class="coin"></i>${cost}` : ''}</button>`).join('')}</div>`);
        }
      }
    }
    body.innerHTML = h + '<div style="height:4px"></div>';
  }
  const section = (title, inner) => `<div class="section"><h3>${title}</h3>${inner}</div>`;
  const chipRow = (list, key) => `<div class="chips"><button class="chip" data-acc="${key}" data-val="" aria-pressed="${!outfit[key]}" type="button">None</button>${list.map(it => `<button class="chip" data-acc="${key}" data-val="${it.id}" aria-pressed="${outfit[key] === it.id}" type="button">${it.name}${it.cost && !owned.has(it.id) ? ` · <i class="coin"></i>${it.cost}` : ''}</button>`).join('')}</div>`;

  $('tabBody').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.skin != null) outfit.skin = +d.skin;
    else if (d.hair) outfit.hair.style = d.hair;
    else if (d.haircolor) outfit.hair.color = d.haircolor;
    else if (d.lips) outfit.lips = d.lips;
    else if (d.metal) outfit.metal = d.metal;
    else if (d.acc) {
      const list = d.acc === 'earrings' ? EARRINGS : d.acc === 'necklace' ? NECKLACES : BELTS, it = list.find(i => i.id === d.val);
      if (it && !isOwned(it)) { if (!buy(it.id, it.cost)) return; }
      outfit[d.acc] = d.val || null;
    } else if (d.buy) { const it = itemById(tab, d.buy); if (buy(it.id, it.cost)) { pendingUnlock = null; equip(tab, it.id); } return; }
    else if (d.item != null) {
      if (!d.item) { outfit[tab] = null; pendingUnlock = null; }
      else { const it = itemById(tab, d.item); if (!isOwned(it)) { pendingUnlock = { slot: tab, id: it.id }; renderTab(); return; } pendingUnlock = null; equip(tab, it.id); return; }
    } else if (d.color) outfit[tab].color = d.color;
    else if (d.pattern) {
      const p = PATTERNS.find(x => x[0] === d.pattern);
      if (p[2] && !owned.has('pat-' + p[0])) { if (!buy('pat-' + p[0], p[2])) return; }
      outfit[tab].pattern = d.pattern;
    }
    render();
  });
  function equip(slot, id) {
    const prev = outfit[slot];
    outfit[slot] = { id, color: prev ? prev.color : defaultColor(slot), pattern: prev ? prev.pattern || 'solid' : 'solid' };
    if (slot === 'dress') { outfit.top = null; outfit.bottom = null; }
    if (slot === 'top' || slot === 'bottom') {
      if (outfit.dress) { outfit.dress = null; }
      if (!outfit.top) outfit.top = { id: 'tee', color: 'white', pattern: 'solid' };
      if (!outfit.bottom) outfit.bottom = { id: 'jeans', color: 'denim', pattern: 'solid' };
    }
    render();
  }
  const defaultColor = slot => ({ top: 'white', bottom: 'denim', dress: 'black', outer: 'camel', shoes: 'black', bag: 'black', hat: 'black' }[slot] || 'black');
  function buy(id, cost) {
    if (owned.has(id)) return true;
    if (coins < cost) { toast(`You need ${cost - coins} more coins. Walk the runway to earn them.`); return false; }
    coins -= cost; owned.add(id); persist(); toast('Unlocked!'); hudCoins(); return true;
  }

  // ---------- stylist panel ----------
  function renderStylist(a) {
    const r = 34, circ = 2 * Math.PI * r, col = a.total >= 78 ? '#2e7d5b' : a.total >= 55 ? '#c2185b' : '#c0612b';
    $('ring').innerHTML = `<circle cx="42" cy="42" r="${r}" fill="none" stroke="#efe6ec" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circ * a.total / 100} ${circ}" transform="rotate(-90 42 42)"/><text x="42" y="46" text-anchor="middle" font-family="Bodoni Moda, Georgia, serif" font-size="24" font-weight="700" fill="#1d1720">${a.total}</text><text x="42" y="60" text-anchor="middle" font-size="8" fill="#74697a" letter-spacing="1">${'★'.repeat(starsFor(a.total))}</text>`;
    const areas = [['Colour', a.color], ...(challenge().brief.length ? [['Occasion', a.occasion]] : []), ['Styling', a.styling]];
    $('areas').innerHTML = areas.map(([n, v]) => `<div class="area"><span>${n}</span><span class="bar"><i style="width:${v * 10}%"></i></span><b>${v.toFixed(1)}</b></div>`).join('');
    $('strip').innerHTML = a.pieces.map(p => `<span style="background:${p.c.hex};flex:${p.area}" title="${p.c.name} ${slotName(p.slot)}"></span>`).join('');
    $('harmony').innerHTML = `Colour scheme: <b>${a.harmony}</b>`;
    $('notes').innerHTML = a.notes.slice(0, 6).map((n, i) => `<div class="note ${n.kind}"><span class="k">${n.kind === 'good' ? 'Works' : n.kind === 'warn' ? 'Fix this' : 'Tip'} · ${n.area}</span><span>${esc(n.text)}</span>${n.fix ? `<button data-fix="${i}" type="button">${fixPreview(n.fix)}${esc(n.fix.label)}</button>` : ''}</div>`).join('');
    $('notes').onclick = e => { const b = e.target.closest('[data-fix]'); if (b) applyFix(a.notes[+b.dataset.fix].fix); };
    $('badgeScore').textContent = a.total; $('badgeStars').textContent = '★'.repeat(starsFor(a.total)) + '☆'.repeat(5 - starsFor(a.total));
  }
  function fixPreview(f) {
    if (!f.slot || !outfit[f.slot] || f.item || f.formality != null || f.solid) return '';
    const sk = hsl(SKINS[outfit.skin]);
    const filter = f.neutral ? c => c.neutral : f.contrast ? c => Math.abs(c.l - C[outfit[f.slot].color].l) > 0.3 && Math.abs(c.l - sk.l) > 0.15 : c => c.key !== outfit[f.slot].color;
    const b = bestColors(f.slot, filter, 1)[0];
    return b ? `<i style="background:${C[b.key].hex}"></i>` : '';
  }
  function renderBrief(a) {
    const ch = challenge();
    $('brief').innerHTML = `<span class="eyebrow">${ch.id === 'studio' ? 'Free play' : 'Client brief'}${stars[ch.id] ? ' · best ' + '★'.repeat(stars[ch.id]) : ''}</span><h2>${ch.title}</h2><p>${ch.blurb}</p>` +
      (ch.brief.length ? `<div class="checks">${a.checks.map(c => `<span class="check ${c.ok ? 'ok' : ''}">${c.label}</span>`).join('')}${a.fails.map(f => `<span class="check no">${f}</span>`).join('')}</div>` : '');
  }
  function hudCoins() { $('coins').textContent = coins; }

  function render() {
    $('model').innerHTML = renderModel(outfit);
    const a = analyze(outfit);
    renderStylist(a); renderBrief(a); renderTab(); hudCoins(); persist();
    return a;
  }

  // ---------- challenges & lookbook sheets ----------
  function openSheet(id) { $(id).hidden = false; }
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('.overlay').hidden = true));
  document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.hidden = true; }));
  $('challengeBtn').addEventListener('click', () => {
    $('challenges').innerHTML = CHALLENGES.map((c, i) => {
      const open = unlockedChallenge(i);
      return `<button class="ch ${open ? '' : 'locked'}" data-ch="${c.id}" ${open ? '' : 'aria-disabled="true"'} type="button"><svg class="scene" viewBox="0 120 300 200" preserveAspectRatio="xMidYMid slice"><defs>${sceneDefs}</defs>${sceneSvg(c.scene)}</svg>
        <span class="body"><b>${c.title}</b><span>${open ? c.blurb : '🔒 Score 3★ on the previous brief to unlock'}</span><span>${c.reward ? `<i class="coin"></i> up to ${c.reward} coins · ` : ''}${stars[c.id] ? '★'.repeat(stars[c.id]) : 'Not played'}</span></span></button>`;
    }).join('');
    openSheet('challengeSheet');
  });
  $('challenges').addEventListener('click', e => {
    const b = e.target.closest('[data-ch]'); if (!b || b.classList.contains('locked')) return;
    challengeId = b.dataset.ch; $('challengeSheet').hidden = true; render(); toast(challenge().title + ': new brief');
  });
  $('lookbookBtn').addEventListener('click', () => {
    $('looks').innerHTML = looks.length ? looks.map((l, i) => `<button class="look" data-look="${i}" type="button"><svg viewBox="0 0 300 640">${renderModel(l.o, { scene: (CHALLENGES.find(c => c.id === l.ch) || CHALLENGES[0]).scene })}</svg><span>${esc(l.name)} · ${l.score} pts</span></button>`).join('')
      : '<p class="empty">No saved looks yet. Tap "Save look" on any outfit you love.</p>';
    openSheet('lookbookSheet');
  });
  $('looks').addEventListener('click', e => { const b = e.target.closest('[data-look]'); if (!b) return; outfit = JSON.parse(JSON.stringify(looks[+b.dataset.look].o)); $('lookbookSheet').hidden = true; render(); toast('Look loaded'); });
  $('saveBtn').addEventListener('click', () => {
    const a = analyze(outfit);
    looks.unshift({ o: JSON.parse(JSON.stringify(outfit)), score: a.total, ch: challengeId, name: challenge().id === 'studio' ? `Look ${looks.length + 1}` : challenge().title });
    looks = looks.slice(0, 24); persist(); toast('Saved to your lookbook');
  });
  $('autoBtn').addEventListener('click', autoStyle);

  // ---------- runway ----------
  const JUDGES = [['Mila Rossi', 'colour', 'color'], ['Jules Okafor', 'occasion', 'occasion'], ['Ines Laurent', 'styling', 'styling']];
  function runway() {
    const a = analyze(outfit), ch = challenge();
    const st = starsFor(a.total);
    const prevStars = stars[ch.id] || 0;
    const reward = ch.reward ? Math.round(ch.reward * a.total / 100) + (st > prevStars ? st * 10 : 0) : Math.round(a.total / 5);
    $('runway').hidden = false;
    $('walker').innerHTML = `<svg viewBox="0 0 300 640">${renderModel(outfit, { bare: true })}</svg>`;
    $('walker').style.animation = 'none'; void $('walker').offsetWidth; $('walker').style.animation = '';
    const stage = $('runwayStage');
    stage.querySelectorAll('.flash').forEach(f => f.remove());
    for (let i = 0; i < 9; i++) setTimeout(() => { const f = document.createElement('span'); f.className = 'flash'; f.style.left = (8 + Math.random() * 84) + '%'; f.style.top = (30 + Math.random() * 50) + '%'; stage.appendChild(f); setTimeout(() => f.remove(), 600); }, 400 + i * 260);
    const say = (area) => { const n = a.notes.find(n => n.area === area && n.kind === 'warn') || a.notes.find(n => n.area === area); return n ? n.text : area === 'occasion' ? 'A free-styled look, full of personality.' : 'Lovely.'; };
    const scores = [a.color, ch.brief.length ? a.occasion : (a.color + a.styling) / 2, a.styling];
    $('judges').innerHTML = JUDGES.map(([who, label, area], i) => `<div class="judge" id="j${i}"><span class="who">${who} · ${label}</span><span class="sc">${scores[i].toFixed(1)}</span><span class="say">${esc(say(area))}</span></div>`).join('');
    $('verdict').className = 'verdict'; $('verdict').innerHTML = '';
    JUDGES.forEach((_, i) => setTimeout(() => $('j' + i).classList.add('in'), 2700 + i * 700));
    setTimeout(() => {
      if (ch.id !== 'studio') stars[ch.id] = Math.max(prevStars, st);
      coins += reward; persist(); hudCoins();
      const next = CHALLENGES.findIndex(c => c.id === ch.id) + 1;
      const nextOpen = next < CHALLENGES.length && unlockedChallenge(next) && ch.id !== 'studio';
      $('verdict').innerHTML = `<h2>${a.total >= 90 ? 'Iconic.' : a.total >= 78 ? 'Stunning!' : a.total >= 64 ? 'Runway ready' : a.total >= 48 ? 'Almost there' : 'Back to the studio'}</h2><span class="stars">${'★'.repeat(st)}${'☆'.repeat(5 - st)}</span>
        <p>${a.total} points · <i class="coin"></i> +${reward} coins${st >= 3 && prevStars < 3 && nextOpen ? ' · next brief unlocked!' : ''}</p>
        <div class="row"><button class="pill" id="rwBack" type="button">Back to the studio</button>${nextOpen ? `<button class="pill ghost" id="rwNext" type="button">Next brief: ${CHALLENGES[next].title}</button>` : ''}</div>`;
      $('verdict').classList.add('in');
      $('rwBack').onclick = () => { $('runway').hidden = true; render(); };
      if ($('rwNext')) $('rwNext').onclick = () => { $('runway').hidden = true; challengeId = CHALLENGES[next].id; render(); };
      if (st >= 4) confetti();
    }, 2700 + 3 * 700 + 300);
  }
  $('runwayBtn').addEventListener('click', runway);
  function confetti() {
    const stage = $('runwayStage');
    for (let i = 0; i < 60; i++) {
      const p = document.createElement('span');
      p.style.cssText = `position:absolute;top:-10px;left:${Math.random() * 100}%;width:7px;height:11px;background:${['#ffd6e6', '#c2185b', '#f3d97a', '#fff', '#9cc9e8'][i % 5]};transform:rotate(${Math.random() * 360}deg);transition:transform 2.6s cubic-bezier(.2,.6,.4,1), top 2.6s cubic-bezier(.2,.6,.4,1), opacity 2.6s;opacity:1`;
      stage.appendChild(p);
      requestAnimationFrame(() => requestAnimationFrame(() => { p.style.top = (60 + Math.random() * 40) + '%'; p.style.transform = `rotate(${Math.random() * 720}deg) translateX(${(Math.random() - .5) * 120}px)`; p.style.opacity = '0'; }));
      setTimeout(() => p.remove(), 2800);
    }
  }

  let toastT = 0;
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

  // test hook
  window.__muse = { get outfit() { return outfit; }, set(o) { outfit = o; render(); }, analyze: () => analyze(outfit), setChallenge(id) { challengeId = id; render(); }, autoStyle, runway, applyFix, bestColors, get coins() { return coins; } };

  renderTabs(); render();
})();
</script>
</body>
</html>
