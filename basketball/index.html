<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hoop Shot 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen 3D arena; scoreboard top centre, settings top right, camera switcher bottom centre, coach card bottom left. */
:root {
  --arena: #050a22;
  --panel: rgba(12, 18, 44, 0.86);
  --line: #24305c;
  --chalk: #f1ede4;
  --muted: #9aa6c8;
  --led: #ffb43d;
  --ball: #e8742c;
  --good: #5fd18b;
  --bad: #ff6b5a;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--arena); color: var(--chalk);
  font-family: var(--body); font-size: 16px; overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
.app { position: relative; height: 100%; }
#gl, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { cursor: grab; }
#fx { pointer-events: none; }
.app.aiming #gl { cursor: grabbing; }

.board {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px; max-width: calc(100% - 32px);
}
.cell { display: grid; justify-items: center; padding: 2px 12px; min-width: 0; }
.cell + .cell { border-left: 1px solid var(--line); }
.lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num {
  font-family: var(--display); font-size: 26px; line-height: 1.1; color: var(--led);
  font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255,180,61,.35); white-space: nowrap;
}
.cell.plain .num { color: var(--chalk); text-shadow: none; }

button { font-family: var(--body); }
.controls { position: absolute; top: 10px; right: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.btn {
  font-weight: 600; font-size: 13px; line-height: 1; letter-spacing: .08em; text-transform: uppercase;
  color: var(--chalk); background: var(--panel); border: 1px solid var(--line);
  border-radius: 4px; padding: 8px 10px; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .views button:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
.btn b { color: var(--led); font-weight: 700; }

.views {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px;
}
.views .lbl { padding: 0 8px 0 6px; }
.views button {
  font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); background: transparent; border: 0; border-radius: 4px; padding: 8px 11px; cursor: pointer; white-space: nowrap;
}
.views button[aria-pressed="true"] { background: var(--ball); color: #1b0f06; }

.coach {
  position: absolute; left: 16px; bottom: 16px; width: min(360px, calc(50% - 230px));
  min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 14px; font-size: 17px; line-height: 1.3;
}
.coach .tag { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--led); font-weight: 700; display: block; margin-bottom: 2px; }
.coach.good .tag { color: var(--good); }
.coach.bad .tag { color: var(--bad); }

#banner {
  position: absolute; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none;
  font-family: var(--display); font-size: clamp(36px, 7vw, 72px); letter-spacing: .02em;
  text-shadow: 0 4px 24px rgba(0,0,0,.6); opacity: 0;
}
#banner.show { animation: pop 1.5s ease-out forwards; }
@keyframes pop {
  0% { opacity: 0; transform: scale(.7); }
  12% { opacity: 1; transform: scale(1.06); }
  20% { transform: scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-14px); }
}
@media (prefers-reduced-motion: reduce) { #banner.show { animation-duration: 1.8s; animation-timing-function: steps(1, end); } }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4,8,24,.75); padding: 16px; }
.card { text-align: center; max-width: 380px; display: grid; gap: 10px; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 44px; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 18px; }
.card .big { font-family: var(--display); font-size: 72px; color: var(--led); line-height: 1; }
.card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.card button { font-weight: 700; font-size: 18px; line-height: 1; letter-spacing: .1em; text-transform: uppercase; background: var(--ball); color: #1b0f06; border: 0; border-radius: 4px; padding: 12px 22px; cursor: pointer; }
.card button.ghost { background: transparent; color: var(--chalk); border: 1px solid var(--line); }

@media (max-width: 1000px) {
  .board { left: 16px; transform: none; }
  .cell { padding: 2px 6px; }
  .num { font-size: 19px; }
  .lbl { font-size: 9px; }
  .views { top: 66px; bottom: auto; left: 16px; right: 16px; transform: none; overflow-x: auto; }
  .views .lbl { display: none; }
  .views button { flex: 1; padding: 7px 6px; font-size: 13px; }
  .controls { top: auto; bottom: 16px; }
  .coach { width: auto; min-width: 0; right: 170px; font-size: 15px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="gl" aria-label="3D basketball court. Drag down and release to shoot."></canvas>
  <canvas id="fx"></canvas>

  <div class="board" role="status">
    <div class="cell"><span class="lbl">Points</span><span class="num" id="score">0</span></div>
    <div class="cell"><span class="lbl">Made</span><span class="num" id="made">0/0</span></div>
    <div class="cell"><span class="lbl">Streak</span><span class="num" id="streak">0</span></div>
    <div class="cell"><span class="lbl">Best</span><span class="num" id="best">0</span></div>
    <div class="cell plain"><span class="lbl">Range</span><span class="num" id="range">0 m</span></div>
    <div class="cell plain" id="clockCell" hidden><span class="lbl">Clock</span><span class="num" id="clock">60</span></div>
  </div>

  <div class="controls">
    <button class="btn" id="guideBtn" type="button">Aim guide: <b>Full</b></button>
    <button class="btn" id="soundBtn" type="button">Sound: <b>On</b></button>
    <button class="btn" id="modeBtn" type="button">60s challenge</button>
  </div>

  <div class="views" role="group" aria-label="Camera view">
    <span class="lbl">Camera</span>
    <button type="button" data-view="rear" aria-pressed="true">Behind</button>
    <button type="button" data-view="front" aria-pressed="false">Front</button>
    <button type="button" data-view="side" aria-pressed="false">Side</button>
    <button type="button" data-view="high" aria-pressed="false">High</button>
    <button type="button" data-view="ball" aria-pressed="false">Ball cam</button>
  </div>

  <div class="coach" id="coach">
    <span class="tag" id="coachTag">How to shoot</span>
    <span id="coachText">Press anywhere and drag down, then let go. A longer pull means more power. Pull sideways to aim: the ball flies the opposite way, like a slingshot.</span>
  </div>

  <div id="banner"></div>

  <div class="overlay" id="overlay" hidden>
    <div class="card">
      <h2>Time!</h2>
      <div class="big" id="ovScore">0</div>
      <p id="ovText"></p>
      <div class="row">
        <button id="againBtn" type="button">Play again</button>
        <button id="practiceBtn" class="ghost" type="button">Practice</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  if (!window.THREE) {
    $('coachTag').textContent = 'Could not load 3D engine';
    $('coachText').textContent = 'The game needs the three.js library from cdn.jsdelivr.net. Check your connection and reload.';
    return;
  }
  const V = THREE.Vector3;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);

  // ---------- real-world dimensions (metres) ----------
  const G = 9.8, BALL_R = 0.12, RIM_R = 0.23, TUBE = 0.012, RIM_Y = 3.05;
  const RIM = new V(0, RIM_Y, 0);
  const BASELINE_Z = -1.58;
  const ARC = 52 * Math.PI / 180;            // launch angle
  const STEP = 1 / 240;
  const BOXES = [                             // static colliders: [minX,minY,minZ,maxX,maxY,maxZ,bounce]
    [-0.9, 2.9, -0.43, 0.9, 3.95, -0.38, 0.62],   // backboard
    [-0.07, 2.99, -0.38, 0.07, 3.05, -0.25, 0.4], // rim bracket
    [-0.13, 0, -2.75, 0.13, 3.55, -2.49, 0.5],    // stanchion pole
    [-0.08, 3.32, -2.49, 0.08, 3.46, -0.43, 0.5], // arm to board
    [-0.6, 0, -3.3, 0.6, 0.9, -2.3, 0.4],         // base pad
  ];

  // ---------- renderer / scene ----------
  const gl = $('gl'), fx = $('fx'), fctx = fx.getContext('2d');
  const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x040820);
  scene.fog = new THREE.Fog(0x040820, 22, 48);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 120);

  scene.add(new THREE.HemisphereLight(0x8fb0ff, 0x2a160a, 0.55));
  scene.add(new THREE.AmbientLight(0x1e2c66, 0.5));
  const spot = new THREE.SpotLight(0xfff4e6, 1.6, 40, 0.62, 0.55, 1.2);
  spot.position.set(1.5, 15, 7); spot.target.position.set(0, 0, 3.5);
  spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.bias = -0.0004;
  spot.shadow.camera.near = 5; spot.shadow.camera.far = 30;
  scene.add(spot, spot.target);
  const rimLight = new THREE.PointLight(0x5c86ff, 0.9, 14); rimLight.position.set(0, 6, -4); scene.add(rimLight);

  function canvasTex(w, h, paint) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    paint(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0 }, o));
  function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
  }

  // ---------- court ----------
  const K = 100; // px per metre on the court texture
  const courtTex = canvasTex(15 * K, 14 * K, (g, w, h) => {
    g.fillStyle = '#e2784a'; g.fillRect(0, 0, w, h);
    for (let x = 0, i = 0; x < w; x += 0.09 * K, i++) {              // maple planks
      g.fillStyle = `hsl(${18 + (i * 37 % 7)}, ${62 + (i * 13 % 9)}%, ${55 + (i * 29 % 7)}%)`;
      g.fillRect(x, 0, 0.09 * K, h);
      g.fillStyle = 'rgba(80,30,10,.18)'; g.fillRect(x, 0, 1, h);
      for (let y = (i * 173) % 260; y < h; y += 260 + (i * 31 % 90)) g.fillRect(x, y, 0.09 * K, 1);
    }
    const P = (x, z) => [(x + 7.5) * K, (z - BASELINE_Z) * K];
    const [kx0, ky0] = P(-2.45, BASELINE_Z), [kx1, ky1] = P(2.45, 4.22);
    g.fillStyle = 'rgba(160,40,30,.55)'; g.fillRect(kx0, ky0, kx1 - kx0, ky1 - ky0);
    g.strokeStyle = '#fbe9cf'; g.lineWidth = 0.05 * K;
    g.strokeRect(2, 2, w - 4, h - 4);
    g.strokeRect(kx0, ky0, kx1 - kx0, ky1 - ky0);
    const [bx, by] = P(0, 0), [fx0, fy0] = P(0, 4.22);
    g.beginPath(); g.arc(fx0, fy0, 1.8 * K, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(bx, by, 1.25 * K, 0, Math.PI); g.stroke();
    const th = Math.acos(6.6 / 6.75), cz = Math.sqrt(6.75 ** 2 - 6.6 ** 2);
    g.beginPath(); g.moveTo(...P(-6.6, BASELINE_Z)); g.lineTo(...P(-6.6, cz));
    g.arc(bx, by, 6.75 * K, Math.PI - th, th, true); g.lineTo(...P(6.6, BASELINE_Z)); g.stroke();
    g.beginPath(); g.arc(w / 2, h, 1.8 * K, Math.PI, 0); g.stroke();
    g.font = `${0.9 * K}px Anton, Impact, sans-serif`; g.textAlign = 'center'; g.fillStyle = 'rgba(251,233,207,.28)';
    g.fillText('HOOP SHOT', w / 2, h - 2.6 * K);
  });
  const court = mesh(new THREE.PlaneGeometry(15, 14), std(0xffffff, { map: courtTex, roughness: 0.42 }), 0, 0, BASELINE_Z + 7);
  court.rotation.x = -Math.PI / 2; court.castShadow = false;
  const apron = mesh(new THREE.PlaneGeometry(90, 90), std(0x0b1335, { roughness: 0.8 }), 0, -0.01, 5);
  apron.rotation.x = -Math.PI / 2; apron.castShadow = false;

  // ---------- arena: stands, crowd, LED boards, light beams ----------
  const standMat = std(0x0a1130, { roughness: 0.9 });
  const seats = [];
  for (let r = 0; r < 9; r++) {
    const y = 0.45 + r * 0.5;
    mesh(new THREE.BoxGeometry(34, 0.5, 0.9), standMat, 0, y - 0.25, -5.2 - r * 0.9).castShadow = false;
    for (const s of [-1, 1]) mesh(new THREE.BoxGeometry(0.9, 0.5, 24), standMat, s * (10.2 + r * 0.9), y - 0.25, 6).castShadow = false;
    for (let x = -16; x <= 16; x += 0.55) if (Math.random() < 0.82) seats.push([x, y, -5.2 - r * 0.9, 0]);
    for (let z = -4; z <= 17; z += 0.55) for (const s of [-1, 1]) if (Math.random() < 0.82) seats.push([s * (10.2 + r * 0.9), y, z, s]);
  }
  const crowd = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.17, 0.3, 3, 8), std(0xffffff, { roughness: 0.9 }), seats.length);
  const shirt = [0x1b2a6b, 0x2d3f8f, 0x7a2430, 0xb35a1f, 0x3a3f4f, 0xd0d4e0, 0x24614a, 0x5a2d82];
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  seats.forEach(([x, y, z], i) => {
    m4.makeTranslation(x + (Math.random() - .5) * .1, y + 0.32, z); crowd.setMatrixAt(i, m4);
    crowd.setColorAt(i, col.setHex(shirt[(Math.random() * shirt.length) | 0]).multiplyScalar(0.55));
  });
  scene.add(crowd);

  const ledTex = canvasTex(1024, 64, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, '#0a1a6a'); gr.addColorStop(.5, '#1f47d6'); gr.addColorStop(1, '#0a1a6a');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#e8eeff'; g.fillRect(0, h - 6, w, 3);
    g.font = '38px Anton, Impact, sans-serif'; g.fillStyle = 'rgba(232,238,255,.9)'; g.textAlign = 'center';
    for (let x = 128; x < w; x += 256) g.fillText('HOOP SHOT', x, 44);
  });
  ledTex.wrapS = THREE.RepeatWrapping;
  const ledMat = new THREE.MeshBasicMaterial({ map: ledTex });
  const ledBack = mesh(new THREE.BoxGeometry(22, 0.8, 0.15), ledMat, 0, 0.4, -4.2); ledBack.castShadow = false;
  for (const s of [-1, 1]) {
    const b = mesh(new THREE.BoxGeometry(0.15, 0.8, 20), ledMat, s * 9.1, 0.4, 6); b.castShadow = false;
  }
  const railMat = new THREE.MeshBasicMaterial({ color: 0xdfe6ff });
  for (const s of [-1, 1]) mesh(new THREE.BoxGeometry(0.05, 0.05, 30), railMat, s * 9.6, 1.5, 6).castShadow = false;
  mesh(new THREE.BoxGeometry(40, 0.05, 0.05), railMat, 0, 1.5, -4.7).castShadow = false;

  const beamMat = new THREE.MeshBasicMaterial({ color: 0x3b6bff, transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  [[-6, -6, 0.25], [0, -7, 0], [6, -6, -0.25]].forEach(([x, z, tilt]) => {
    const c = new THREE.Mesh(new THREE.ConeGeometry(3.2, 18, 32, 1, true), beamMat);
    c.position.set(x, 9, z); c.rotation.z = tilt; scene.add(c);
  });
  const glowTex = canvasTex(256, 256, (g, w, h) => {
    const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    r.addColorStop(0, 'rgba(70,110,255,.55)'); r.addColorStop(1, 'rgba(70,110,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, h);
  });
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(40, 26), new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false }));
  glow.position.set(0, 10, -14); scene.add(glow);

  // ---------- hoop ----------
  const steel = std(0x1a2350, { metalness: 0.5, roughness: 0.4 });
  mesh(new THREE.BoxGeometry(0.26, 3.55, 0.26), steel, 0, 1.775, -2.62);
  mesh(new THREE.BoxGeometry(0.16, 0.14, 2.06), steel, 0, 3.39, -1.46);
  mesh(new THREE.BoxGeometry(1.2, 0.9, 1.0), std(0x1f47d6, { roughness: 0.7 }), 0, 0.45, -2.8);
  const boardTex = canvasTex(720, 420, (g, w, h) => {
    g.fillStyle = 'rgba(220,235,255,0.16)'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#ff3b2f'; g.lineWidth = 14; g.strokeRect(7, 7, w - 14, h - 14);
    g.lineWidth = 10; g.strokeRect(w / 2 - 118, h - 60 - 180, 236, 180);
  });
  const board = mesh(new THREE.BoxGeometry(1.8, 1.05, 0.05),
    new THREE.MeshStandardMaterial({ color: 0xffffff, map: boardTex, transparent: true, roughness: 0.1, metalness: 0.1, opacity: 1, depthWrite: false }),
    0, 3.425, -0.405);
  board.castShadow = false;
  const rimMat = std(0xff4a1c, { metalness: 0.6, roughness: 0.35, emissive: 0x401000 });
  const rimMesh = mesh(new THREE.TorusGeometry(RIM_R, TUBE * 1.5, 12, 48), rimMat, 0, RIM_Y, 0);
  rimMesh.rotation.x = Math.PI / 2;
  mesh(new THREE.BoxGeometry(0.1, 0.05, 0.16), rimMat, 0, RIM_Y - 0.02, -0.31);

  // net: rings of knots, diamond weave
  const NET_N = 16, NET_R = 5, NET_D = 0.42;
  const netPts = [];
  for (let j = 0; j < NET_R; j++) for (let i = 0; i < NET_N; i++) netPts.push(new V());
  const netIdx = [];
  for (let j = 0; j < NET_R - 1; j++) for (let i = 0; i < NET_N; i++) {
    netIdx.push(j * NET_N + i, (j + 1) * NET_N + i, j * NET_N + i, (j + 1) * NET_N + (i + NET_N - 1 + (j % 2 ? 2 : 0)) % NET_N);
  }
  const netGeo = new THREE.BufferGeometry();
  netGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(netPts.length * 3), 3));
  netGeo.setIndex(netIdx);
  const net = new THREE.LineSegments(netGeo, new THREE.LineBasicMaterial({ color: 0xf4f6ff, transparent: true, opacity: 0.9 }));
  scene.add(net);
  let netKick = 0, netT = 0;
  function updateNet(dt) {
    netT += dt; netKick = Math.max(0, netKick - dt * 1.2);
    const pos = netGeo.attributes.position;
    for (let j = 0; j < NET_R; j++) {
      const f = j / (NET_R - 1);
      const r = lerp(RIM_R, 0.14, f);
      const y = RIM_Y - f * NET_D * (1 + netKick * 0.25);
      const sway = Math.sin(netT * 16 + j) * 0.03 * netKick * f;
      for (let i = 0; i < NET_N; i++) {
        const a = (i + (j % 2) * 0.5) / NET_N * Math.PI * 2;
        const p = netPts[j * NET_N + i].set(Math.cos(a) * r + sway, y, Math.sin(a) * r);
        if (j > 0) { // ball pushes the mesh outwards
          const dx = p.x - ball.p.x, dy = p.y - ball.p.y, dz = p.z - ball.p.z, d = Math.hypot(dx, dy, dz);
          if (d < BALL_R + 0.02 && d > 1e-4) { const k = (BALL_R + 0.02) / d; p.set(ball.p.x + dx * k, ball.p.y + dy * k, ball.p.z + dz * k); }
        }
        pos.setXYZ(j * NET_N + i, p.x, p.y, p.z);
      }
    }
    pos.needsUpdate = true;
  }

  // ---------- ball ----------
  const ballTex = canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = '#d8622a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 26000; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(60,20,0,.10)' : 'rgba(255,190,140,.10)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    g.strokeStyle = '#1c0d05'; g.lineWidth = 9;

      pose.jump = jumpAt(t);
      pose.hold = 1 + Math.min(1, t / T_REL);
      if (t >= T_REL) {                    // release
        pose.hold = 2; applyPose();
        ball.p.copy(releasePoint()); ball.v.copy(shot.v); ball.held = false;
        const d = hoopDir(ball.p); ball.spin.set(-d.z, 0, d.x).multiplyScalar(-14); // backspin
        stats.att++; hud(); tone('throw');
        phase = 'flight';
      }
      drawDots(null);
    }
    if (phase !== 'ready' && phase !== 'aim') { drawDots(null); drawPull(null); }
    if (phase === 'flight') {
      animT += dt;
      pose.jump = jumpAt(animT); pose.k = animT > T_EXT + T_AIR ? lerp(pose.k, 0.25, 0.2) : 0;
      if (animT > T_EXT + T_AIR + 0.15) pose.k = lerp(pose.k, 0, 0.1);
      if (animT > 1.3) pose.armsDown = Math.min(1, pose.armsDown + dt * 2);
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      shot.t += dt;
      const onFloor = ball.p.y <= BALL_R + 0.001 && ball.v.y === 0;
      if (onFloor) ball.spin.set(ball.v.z, 0, -ball.v.x).multiplyScalar(1 / BALL_R);
      shot.rest = onFloor && Math.hypot(ball.v.x, ball.v.z) < 0.6 ? shot.rest + dt : 0;
      if (shot.scored && shot.endIn === null && ball.p.y < RIM_Y - 0.6) shot.endIn = 1.1;
      if (shot.endIn !== null) shot.endIn -= dt;
      const gone = Math.abs(ball.p.x) > 14 || ball.p.z > 18 || ball.p.z < -6;
      if ((shot.endIn !== null && shot.endIn <= 0) || shot.rest > 0.3 || gone || shot.t > 7) endShot();
    } else acc = 0;

    applyPose();
    if (ball.held) ball.p.copy(player.localToWorld(ballLocal.clone()));
    ballMesh.position.copy(ball.p);
    if (!ball.held) {
      const w = ball.spin.length();
      if (w > 1e-3) ballMesh.rotateOnWorldAxis(tmpC.copy(ball.spin).divideScalar(w), w * dt);
    }
    updateNet(dt);

    if (mode === 'challenge' && $('overlay').hidden) {
      clock -= dt;
      if (clock <= 0) { clock = 0; finishChallenge(); }
      $('clock').textContent = Math.ceil(clock);
    }

    cameraTarget();
    const f = 1 - Math.exp(-dt * (view === 'ball' ? 5 : 3.2));
    camPos.lerp(wantPos, f); camLook.lerp(wantLook, f);
    camera.position.copy(camPos); camera.lookAt(camLook);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ---------- 2D pull indicator ----------
  let fxDirty = false;
  function drawPull(a) {
    if (!a && !fxDirty) return;
    fxDirty = !!a;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.clearRect(0, 0, fx.width, fx.height);
    if (!a || !aim) return;
    fctx.strokeStyle = 'rgba(241,237,228,.6)'; fctx.lineWidth = 2; fctx.setLineDash([5, 7]);
    fctx.beginPath(); fctx.moveTo(aim.sx, aim.sy); fctx.lineTo(aim.cx, aim.cy); fctx.stroke(); fctx.setLineDash([]);
    fctx.fillStyle = 'rgba(241,237,228,.8)'; fctx.beginPath(); fctx.arc(aim.sx, aim.sy, 6, 0, 7); fctx.fill();
    fctx.strokeStyle = 'rgba(0,0,0,.35)'; fctx.lineWidth = 7;
    fctx.beginPath(); fctx.arc(aim.cx, aim.cy, 30, -Math.PI / 2, Math.PI * 1.5); fctx.stroke();
    fctx.strokeStyle = a.power > 0.95 ? '#ff6b5a' : '#ffb43d'; fctx.lineWidth = 5;
    fctx.beginPath(); fctx.arc(aim.cx, aim.cy, 30, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * a.power); fctx.stroke();
    fctx.fillStyle = '#f1ede4'; fctx.font = '600 15px "Barlow Condensed", sans-serif'; fctx.textAlign = 'center';
    const deg = Math.round(a.yaw * 180 / Math.PI);
    fctx.fillText(Math.round(a.power * 100) + '% power' + (deg ? ' · ' + Math.abs(deg) + '° ' + (deg > 0 ? 'right' : 'left') : ''), aim.cx, aim.cy + 52);
  }

  // ---------- HUD ----------
  function hud() {
    $('score').textContent = stats.points; $('made').textContent = stats.made + '/' + stats.att;
    $('streak').textContent = stats.streak; $('best').textContent = best;
  }
  function updateRange() {
    const d = distToRim(player.position);
    $('range').textContent = d.toFixed(1) + ' m' + (isThree(player.position) ? ' · 3' : '');
  }
  function coach(kind, tag, text) { $('coach').className = 'coach ' + kind; $('coachTag').textContent = tag; $('coachText').textContent = text; }
  function banner(text, color) {
    const b = $('banner'); b.textContent = text; b.style.color = color;
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  }

  const viewBtns = [...document.querySelectorAll('.views button')];
  function setView(v) { view = v; viewBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v)); }
  viewBtns.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  addEventListener('keydown', e => {
    const i = '12345'.indexOf(e.key);
    if (i >= 0) setView(viewBtns[i].dataset.view);
    if (e.key === 'v' || e.key === 'c') setView(viewBtns[(viewBtns.findIndex(b => b.dataset.view === view) + 1) % viewBtns.length].dataset.view);
  });
  $('guideBtn').addEventListener('click', () => {
    guide = (guide + 2) % 3; $('guideBtn').innerHTML = 'Aim guide: <b>' + guideNames[guide] + '</b>';
    if (guide === 0) coach('', 'No guide', 'Shooting on feel now. Watch the power ring instead.');
  });
  $('soundBtn').addEventListener('click', () => { sound = !sound; $('soundBtn').innerHTML = 'Sound: <b>' + (sound ? 'On' : 'Off') + '</b>'; });
  $('modeBtn').addEventListener('click', () => mode === 'practice' ? startChallenge() : startPractice());
  $('againBtn').addEventListener('click', startChallenge);
  $('practiceBtn').addEventListener('click', startPractice);

  function resetRound() {
    stats = { points: 0, made: 0, att: 0, streak: 0 }; shot = null; aim = null;
    playerTarget.set(0, 0, 5.2); phase = 'move'; hud();
  }
  function startChallenge() {
    mode = 'challenge'; clock = 60; resetRound();
    $('overlay').hidden = true; $('clockCell').hidden = false; $('modeBtn').textContent = 'Back to practice';
    coach('', '60-second challenge', 'Score as many points as you can. Threes count 3, a swish adds 1.');
  }
  function startPractice() {
    mode = 'practice'; resetRound();
    $('overlay').hidden = true; $('clockCell').hidden = true; $('modeBtn').textContent = '60s challenge';
    coach('', 'Practice', 'Take your time. A miss keeps you on the same spot so you can adjust.');
  }
  function finishChallenge() {
    const pct = stats.att ? Math.round(stats.made / stats.att * 100) : 0;
    $('ovScore').textContent = stats.points;
    $('ovText').textContent = stats.made + ' of ' + stats.att + ' shots (' + pct + '%) · Best ' + best;
    $('overlay').hidden = false;
    if (phase !== 'move') { shot = null; aim = null; phase = 'move'; }
  }

  // ---------- sound ----------
  let ac = null;
  function initAudio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  function tone(kind, strength) {
    if (!sound || !ac) return;
    const t = ac.currentTime, vol = Math.min(1, (strength || 4) / 7);
    const g = ac.createGain(); g.connect(ac.destination);
    if (kind === 'swish' || kind === 'throw') {
      const len = kind === 'swish' ? 0.35 : 0.12;
      const buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = ac.createBufferSource(); src.buffer = buf;
      const flt = ac.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = kind === 'swish' ? 3000 : 1200;
      src.connect(flt); flt.connect(g); g.gain.setValueAtTime(kind === 'swish' ? 0.5 : 0.12, t); src.start(t);
      return;
    }
    const o = ac.createOscillator();
    if (kind === 'rim') { o.type = 'triangle'; o.frequency.setValueAtTime(520, t); g.gain.setValueAtTime(0.25 * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35); }
    else if (kind === 'board') { o.type = 'square'; o.frequency.setValueAtTime(140, t); g.gain.setValueAtTime(0.12 * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); }
    else { o.type = 'sine'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.15); g.gain.setValueAtTime(0.5 * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); }
    o.connect(g); o.start(t); o.stop(t + 0.4);
  }

  // ---------- resize / boot ----------
  function resize() {
    const w = gl.clientWidth, h = gl.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
    fx.width = w * dpr; fx.height = h * dpr;
    camera.aspect = w / h; camera.fov = w < h ? 68 : 50; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize(); faceHoop(); applyPose(); updateRange(); hud();
  cameraTarget(); camPos.copy(wantPos); camLook.copy(wantLook);
  // test hook: runs one shot's physics instantly from the current spot without touching the score
  window.__hoop = {
    get phase() { return phase; }, setView, player,
    simulate(power, yaw = 0) {
      const keep = { stats: { ...stats }, best, held: ball.held, p: ball.p.clone(), v: ball.v.clone(), sound };
      const a = velocityFor(power, yaw); sound = false;
      shot = { t: 0, scored: false, touched: false, rimHit: false, maxY: 0, cross: null };
      ball.p.copy(a.start); ball.v.copy(a.v);
      for (let i = 0; i < 240 * 4 && !shot.scored; i++) step(STEP);
      const r = { scored: shot.scored, swish: shot.scored && !shot.touched, maxY: shot.maxY, cross: shot.cross && shot.cross.toArray() };
      shot = null; stats = keep.stats; best = keep.best; sound = keep.sound;
      ball.held = keep.held; ball.p.copy(keep.p); ball.v.copy(keep.v); hud();
      return r;
    },
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
